<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Space Wire // Executive Media Briefing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ultra-compact Google News wire styling */
    .story-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.18s ease-out, opacity 0.15s ease-out;
      opacity: 0;
    }
    .story-row.open .story-drawer {
      max-height: 380px;
      opacity: 1;
    }
    .story-row.open .chevron-icon {
      transform: rotate(90deg);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Compact Top Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-2">
      <div class="flex items-center justify-between">
        
        <!-- Left: Portal Switcher -->
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span class="text-xs font-bold uppercase font-mono tracking-wider text-slate-200">Space Intel</span>
          </div>

         <nav class="flex items-center bg-slate-950 p-0.5 rounded border border-slate-800 text-[10px]">
            <a href="index.html" class="px-2.5 py-0.5 rounded text-slate-400 hover:text-white transition">
              🏛 Procurement
            </a>
            <a href="news.html" class="px-2.5 py-0.5 rounded bg-slate-800 text-white font-semibold border border-slate-700">
              📰 Global Wire
            </a>
            <a href="clients.html" class="px-2.5 py-0.5 rounded text-slate-400 hover:text-white transition">
              🎯 Client Wire
            </a>
            <a href="calendar.html" class="px-2.5 py-0.5 rounded text-slate-400 hover:text-white transition">
              📅 Calendar
            </a>
          </nav>
        </div>

        <!-- Right: Status -->
        <div class="flex items-center gap-2.5">
          <span id="report-date" class="text-[10px] font-mono bg-slate-950 text-slate-400 px-2 py-0.5 rounded border border-slate-800">
            Syncing...
          </span>
          <button id="btn-refresh" class="text-[11px] bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-2.5 py-0.5 rounded transition">
            Refresh
          </button>
        </div>
      </div>

      <!-- Wrapped Category Filter Pills Bar with Dynamic Counts -->
      <div class="flex flex-wrap items-center gap-1.5 pt-1.5 pb-0.5 border-t border-slate-800/60" id="category-pills">
        <button data-cat="all" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-semibold bg-cyan-600 text-white flex items-center gap-1">
          <span>All Stories</span> <span id="ncount-all" class="font-mono text-[9px] bg-cyan-950/80 px-1 rounded">0</span>
        </button>
        <button data-cat="China" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🇨🇳 China</span> <span id="ncount-China" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Russia" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🇷🇺 Russia</span> <span id="ncount-Russia" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Launch" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🚀 Launch</span> <span id="ncount-Launch" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Spacecraft & Ops" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🛰 Spacecraft & Ops</span> <span id="ncount-Spacecraft" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Commercial" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>💼 Commercial</span> <span id="ncount-Commercial" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Policy & Hill" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🏛 Policy & Hill</span> <span id="ncount-Policy" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Technology" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>⚡ Technology</span> <span id="ncount-Technology" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="National Security" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🛡 National Security</span> <span id="ncount-NatSec" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="International" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 flex items-center gap-1">
          <span>🌍 International</span> <span id="ncount-International" class="font-mono text-[9px] bg-slate-800 px-1 rounded">0</span>
        </button>
        <button data-cat="Golden Dome" class="cat-pill px-2.5 py-0.5 rounded text-[10px] font-medium bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 border border-amber-500/30 flex items-center gap-1">
          <span>★ Golden Dome</span> <span id="ncount-Golden" class="font-mono text-[9px] bg-amber-950/60 px-1 rounded border border-amber-500/30">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-3 space-y-2">

    <!-- Dense Search Toolbar -->
    <div class="flex items-center justify-between gap-3 pb-1 border-b border-slate-800/80">
      <div class="text-[11px] text-slate-400 font-mono flex items-center gap-2">
        <span class="text-slate-500">WIRE:</span>
        <span id="active-category-label" class="font-bold text-slate-200 uppercase">All Stories</span>
        <span id="story-count" class="text-slate-500">&bull; 0 stories</span>
      </div>

      <div class="w-72">
        <input type="text" id="search-input" placeholder="Filter wire..." 
          class="w-full bg-slate-900 border border-slate-800 text-slate-100 text-xs rounded px-2.5 py-1 focus:outline-none focus:border-cyan-500 transition">
      </div>
    </div>

    <!-- Status States -->
    <div id="loading" class="text-center py-16 text-slate-400 text-xs font-mono">
      <div class="inline-block w-4 h-4 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mb-1.5"></div>
      <div>Loading global wire...</div>
    </div>

    <div id="error-box" class="hidden bg-rose-950/40 border border-rose-800 p-3 rounded text-rose-300 text-xs space-y-1">
      <div class="font-bold">Failed to load news payload</div>
      <div id="error-details" class="font-mono text-rose-400"></div>
    </div>

    <!-- Ultra-Dense News Wire Terminal (Source is hidden until row expansion) -->
    <div id="news-container" class="hidden bg-slate-900 border border-slate-800 rounded divide-y divide-slate-800/60 overflow-hidden shadow-sm"></div>

  </main>

<script>
    let rawArticles = [];
    let currentCategory = 'all';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .split('&').join('&amp;')
        .split('<').join('&lt;')
        .split('>').join('&gt;')
        .split('"').join('&quot;')
        .split("'").join('&#039;');
    }

    function setSafeText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

// Chronological date parser: Valid dates sort newest-first; "Recent" sinks to the bottom
    function getItemTimestamp(item) {
      const pub = (item.pub_date || item.date || '').trim();

      // If it has a real date string and is NOT labeled "Recent"
      if (pub && !pub.toLowerCase().includes('recent')) {
        const parsed = Date.parse(pub);
        if (!isNaN(parsed)) {
          return parsed;
        }
      }

      // Sink items marked "Recent" or with unparseable dates to the bottom of the 2-week window
      // Subtracting 20 days ensures they sit below every verified dated article from the past 14 days
      const fallback = Date.parse(item.ingested_at) || Date.now();
      return fallback - (20 * 24 * 60 * 60 * 1000);
    }

    function sortByDate(arr) {
      return (arr || []).slice().sort((a, b) => getItemTimestamp(b) - getItemTimestamp(a));
    }
    function getPayloadUrl() {
      let path = window.location.pathname;
      if (path.endsWith('news.html') || path.endsWith('index.html')) {
        path = path.slice(0, path.lastIndexOf('/') + 1);
      }
      if (!path.endsWith('/')) path += '/';
      return window.location.origin + path + 'data/latest.json?t=' + Date.now();
    }

    async function loadNews() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('news-container');
      const errBox = document.getElementById('error-box');
      const errDetails = document.getElementById('error-details');

      loading.classList.remove('hidden');
      container.classList.add('hidden');
      errBox.classList.add('hidden');

      const targetUrl = getPayloadUrl();
      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' (' + res.statusText + ') requesting ' + targetUrl);
        const data = await res.json();
        
        // Sort articles newest-first
        rawArticles = sortByDate(data.space_news || []);

        // Update Pill Badges with exact counts
        setSafeText('ncount-all', rawArticles.length);
        setSafeText('ncount-China', rawArticles.filter(a => a.category === 'China').length);
        setSafeText('ncount-Russia', rawArticles.filter(a => a.category === 'Russia').length);
        setSafeText('ncount-Launch', rawArticles.filter(a => a.category === 'Launch').length);
        setSafeText('ncount-Spacecraft', rawArticles.filter(a => a.category === 'Spacecraft & Ops').length);
        setSafeText('ncount-Commercial', rawArticles.filter(a => a.category === 'Commercial').length);
        setSafeText('ncount-Policy', rawArticles.filter(a => a.category === 'Policy & Hill').length);
        setSafeText('ncount-Technology', rawArticles.filter(a => a.category === 'Technology').length);
        setSafeText('ncount-NatSec', rawArticles.filter(a => a.category === 'National Security').length);
        setSafeText('ncount-International', rawArticles.filter(a => a.category === 'International').length);
        setSafeText('ncount-Golden', rawArticles.filter(a => !!a.is_golden_dome).length);
        
        setSafeText('report-date', 'REPORT: ' + (data.report_date || 'N/A'));
        
        renderStories();
        loading.classList.add('hidden');
        container.classList.remove('hidden');
      } catch (err) {
        loading.classList.add('hidden');
        if (errDetails) errDetails.textContent = err.message;
        errBox.classList.remove('hidden');
      }
    }

    function renderStories() {
      const container = document.getElementById('news-container');
      const searchEl = document.getElementById('search-input');
      const query = (searchEl ? searchEl.value : '').toLowerCase().trim();

      container.innerHTML = '';

      const filtered = rawArticles.filter(function(art) {
        const matchesQuery = query === '' || 
          art.title.toLowerCase().includes(query) || 
          art.description.toLowerCase().includes(query) ||
          art.source.toLowerCase().includes(query);

        let matchesCat = true;
        if (currentCategory === 'Golden Dome') {
          matchesCat = !!art.is_golden_dome;
        } else if (currentCategory !== 'all') {
          matchesCat = (art.category === currentCategory);
        }

        return matchesQuery && matchesCat;
      });

      setSafeText('story-count', filtered.length + ' stories');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-6 text-center text-slate-500 font-mono text-xs">No wire stories match the selected criteria.</div>';
        return;
      }

      filtered.forEach(function(art) {
        const row = document.createElement('div');
        row.className = 'story-row hover:bg-slate-850/60 transition-colors';

        let catBadge = 'bg-slate-800 text-slate-300 border-slate-700';
        if (art.category === 'China') catBadge = 'bg-red-950/40 text-red-400 border-red-800/50';
        if (art.category === 'Russia') catBadge = 'bg-orange-950/40 text-orange-400 border-orange-800/50';
        if (art.category === 'Launch') catBadge = 'bg-emerald-950/40 text-emerald-400 border-emerald-800/50';
        if (art.category === 'Spacecraft & Ops') catBadge = 'bg-purple-950/40 text-purple-400 border-purple-800/50';
        if (art.category === 'Commercial') catBadge = 'bg-amber-950/40 text-amber-300 border-amber-800/50';
        if (art.category === 'Policy & Hill') catBadge = 'bg-blue-950/40 text-blue-400 border-blue-800/50';
        if (art.category === 'Technology') catBadge = 'bg-cyan-950/40 text-cyan-400 border-cyan-800/50';

        let relatedHtml = '';
        if (art.related_coverage && art.related_coverage.length > 0) {
          relatedHtml = 
            '<div class="pt-2 border-t border-slate-800/80 flex items-center gap-2 flex-wrap">' +
              '<span class="text-[10px] font-mono text-slate-500 uppercase tracking-wider">Other Reporting:</span>' +
              art.related_coverage.map(function(rel) {
                return '<a href="' + escapeHtml(rel.url) + '" target="_blank" class="text-[10px] bg-slate-900 hover:bg-slate-850 border border-slate-800 px-2 py-0.5 rounded text-cyan-400 hover:text-cyan-300 transition">' +
                  '<span class="font-bold text-slate-300">' + escapeHtml(rel.source) + ':</span> ' + escapeHtml(rel.title.slice(0, 48)) + '... ↗' +
                '</a>';
              }).join('') +
            '</div>';
        }

        row.innerHTML = 
          '<div class="story-header px-3 py-1 cursor-pointer flex items-center justify-between gap-3 select-none hover:bg-slate-800/40">' +
            '<div class="flex items-center gap-2 min-w-0 flex-1">' +
              '<span class="text-[9px] font-mono font-medium border px-1.5 py-0.2 rounded shrink-0 ' + catBadge + '">' + escapeHtml(art.category) + '</span>' +
              '<span class="text-xs text-slate-200 truncate hover:text-cyan-300 transition font-normal">' + escapeHtml(art.title) + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-2.5 shrink-0">' +
              '<span class="text-[10px] font-mono text-slate-500 hidden sm:inline">' + escapeHtml(art.pub_date || '') + '</span>' +
              '<span class="chevron-icon text-slate-500 text-[10px] transition-transform duration-150">▸</span>' +
            '</div>' +
          '</div>' +

          '<div class="story-drawer px-3 pb-2">' +
            '<div class="p-2.5 bg-slate-950 rounded border border-slate-800 space-y-1.5">' +
              '<div class="flex items-center justify-between text-[11px] pb-1 border-b border-slate-800/60">' +
                '<div class="flex items-center gap-2 flex-wrap">' +
                  '<span class="font-mono font-bold text-cyan-400 uppercase tracking-wide">' + escapeHtml(art.source) + '</span>' +
                  '<span class="text-slate-600">&bull;</span>' +
                  (art.author && art.author !== art.source ? '<span class="text-slate-400">Byline: <span class="text-slate-200 font-medium">' + escapeHtml(art.author) + '</span></span><span class="text-slate-600">&bull;</span>' : '') +
                  '<span class="text-slate-500">Beat: ' + escapeHtml(art.tier || art.category) + '</span>' +
                '</div>' +
                '<a href="' + escapeHtml(art.url) + '" target="_blank" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-2 py-0.5 rounded text-[10px] transition shrink-0">' +
                  'Full Article ↗' +
                '</a>' +
              '</div>' +
              '<p class="text-[11px] text-slate-300 leading-relaxed font-sans">' +
                escapeHtml(art.description || 'No excerpt available. Click above to view full article.') +
              '</p>' +
              relatedHtml +
            '</div>' +
          '</div>';

        row.querySelector('.story-header').addEventListener('click', function() {
          row.classList.toggle('open');
        });

        container.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.cat-pill').forEach(function(pill) {
        pill.addEventListener('click', function() {
          document.querySelectorAll('.cat-pill').forEach(function(p) {
            p.className = 'cat-pill px-2 py-0.2 rounded text-[10px] font-medium bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800 whitespace-nowrap';
          });
          this.className = 'cat-pill px-2 py-0.2 rounded text-[10px] font-semibold bg-cyan-600 text-white whitespace-nowrap';
          
          currentCategory = this.getAttribute('data-cat');
          setSafeText('active-category-label', this.textContent.trim());
          renderStories();
        });
      });

      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.addEventListener('keyup', renderStories);

      const btnRefresh = document.getElementById('btn-refresh');
      if (btnRefresh) btnRefresh.addEventListener('click', loadNews);

      loadNews();
    });
  </script>
</body>
</html>
</body>
</html>
