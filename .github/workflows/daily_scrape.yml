name: Daily Space & Golden Dome Intelligence Scraper

on:
  schedule:
    # 10:30 UTC = 06:30 AM EST (Morning hearing agendas)
    - cron: '30 10 * * 1-5'
    # 21:45 UTC = 05:45 PM EST (Evening DoD contract awards)
    - cron: '45 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-intel-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & OS Libraries
        run: |
          playwright install --with-deps chromium

      - name: Run Intelligence Ingestion Pipeline
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python run_pipeline.py

      - name: Commit and Push New Intelligence Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/*.json
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(intel): update daily space intelligence [skip ci]"
            git push
          fi
